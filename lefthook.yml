pre-commit:
  parallel: true
  commands:
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --fix
      stage_fixed: true
    gofmt:
      glob: "*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    golangci-lint:
      run: golangci-lint run
